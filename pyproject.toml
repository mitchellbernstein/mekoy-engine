[project]
name = "mekoy"
version = "0.1.0"
description = "Compiler for owned AI systems — local extract-and-verify MVP"
readme = "README.md"
authors = [
    { name = "Mitchell Bernstein", email = "mitchellbernstein@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
    "fastapi>=0.141.1",
    "httpx2[http2,brotli,zstd]>=2.12",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.52.4",
]

[project.scripts]
mekoy = "mekoy.cli:main"

[project.optional-dependencies]
# The reflective inner optimiser. Optional on purpose: `spec.json` must stay
# loadable and invokable without DSPy installed.
gepa = ["dspy>=3.3,<4"]
# The experiments layer. Optional: it pulls 51 packages, and the JSONL
# fallback in `tracking.py` records the same fields without them.
mlflow = ["mlflow>=3,<4"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportUnnecessaryComparison = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    "TC001",
    "TC003",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"src/mekoy/cli.py" = ["T201", "PLR0913", "PLR0917"]
"src/mekoy/evalgen.py" = ["T201"]
# The harness entry point names every knob a caller may set; grouping them into
# an options object would only move the same six arguments one level down.
"src/mekoy/harness.py" = ["PLR0913"]
# dspy is an optional, untyped dependency imported lazily on purpose,
# so its objects are `Any` and the import cannot live at module scope.
"src/mekoy/gepa.py" = ["ANN401", "PLC0415"]
"src/mekoy/bootstrap.py" = ["ANN401"]
# MLflow is optional and imported lazily on purpose, exactly like dspy.
"src/mekoy/tracking.py" = ["ANN401", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "ollama: hits a local Ollama server",
]
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
