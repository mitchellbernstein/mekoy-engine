name: ci

# PLAN §41.26: unit tests, no GPU required. Nothing here touches a model server,
# so CI is deterministic and the eval split is enforced by tests rather than by
# a live run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q

      - name: Generated eval labels satisfy the gate
        run: uv run python -m mekoy.evalgen

      - name: Fail if the generated corpus drifts
        run: git diff --exit-code -- examples/bucko-restaurant/generated.jsonl
